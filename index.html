<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>몽타주 - 용의자를 지목하라</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%233b4a63%22/></svg>" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="game-screen" class="screen screen-idle">
    <p id="phase-hud" class="phase-hud hidden"></p>

    <section id="idle-view" class="view">
      <h1>몽타주 - 용의자를 지목하라</h1>
      <p>5초간 몽타주를 기억한 뒤, 3명의 용의자 중 같은 얼굴을 최대한 빨리 지목하세요.</p>
      <p id="idle-tier" class="idle-tier"></p>
      <button id="start-btn" type="button">수사 시작</button>
    </section>

    <section id="memorize-view" class="view hidden">
      <p>몽타주를 기억하세요</p>
      <div id="montage-face" class="montage-face"></div>
    </section>

    <section id="lineup-view" class="view hidden">
      <p>용의자를 지목하세요!</p>
      <div id="lineup-faces" class="lineup"></div>
    </section>

    <section id="fail-view" class="view hidden">
      <p>오답! 진짜 용의자는 이 얼굴입니다.</p>
      <div id="fail-faces" class="lineup"></div>
      <button id="restart-btn" type="button">다시 수사</button>
    </section>

    <section id="result-view" class="view hidden">
      <p id="result-ms" class="result-ms"></p>
      <p id="tier-badge" class="tier-badge"></p>
      <p id="personal-best" class="personal-best"></p>

      <form id="save-form">
        <input id="nickname-input" type="text" maxlength="10" placeholder="닉네임 입력" autocomplete="off" />
        <button id="save-btn" type="submit">기록 저장</button>
      </form>
      <p id="save-status" class="save-status" aria-live="polite"></p>

      <div class="ranking">
        <h2>랭킹 TOP 5</h2>
        <ol id="ranking-list"></ol>
      </div>

      <div class="mode-buttons">
        <button id="retry-btn" type="button">다시하기</button>
        <button id="home-btn" type="button">처음으로</button>
      </div>
    </section>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
